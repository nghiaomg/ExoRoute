name: Branch Build

# Release builds only run on version tags. This workflow keeps fresh,
# smoke-tested binaries for every long-lived branch so a commit on `develop`
# or `main` is always known to build on all supported desktop platforms.
on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            binary: target/x86_64-unknown-linux-gnu/release/exoroute
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            binary: target/x86_64-pc-windows-msvc/release/exoroute.exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: darwin-x86_64
            binary: target/x86_64-apple-darwin/release/exoroute
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: darwin-aarch64
            binary: target/aarch64-apple-darwin/release/exoroute

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Rust binary embeds web/dist with RustEmbed, so the dashboard must
      # be built before cargo on every platform.
      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}

      - name: Build ExoRoute
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test Unix binary
        if: matrix.asset != 'windows-x86_64'
        shell: bash
        run: ./${{ matrix.binary }} --version

      - name: Smoke test Windows binary
        if: matrix.asset == 'windows-x86_64'
        shell: pwsh
        run: '& "${{ matrix.binary }}" --version'

      - name: Upload branch binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: exoroute-${{ matrix.asset }}-${{ github.sha }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7
