# This catalog is parsed during the build and embedded in the ExoRoute binary.
# adapter_id must refer to a Rust adapter registered in src/provider_adapters.rs.
# Metadata cannot add protocol/auth behavior that the adapter does not implement.
providers:
  - id: openai
    adapter_id: openai
    name: OpenAI
    description: Connect directly to the official OpenAI platform using an API key.
    category: cloud_api
    labels: []
    default_base_url: https://api.openai.com/v1
    default_logo_url: null
    default_model_prefix: openai
    default_models:
      - gpt-4o
      - gpt-4o-mini
      - o1
      - o3-mini
      - gpt-4.5-preview
    default_auth_type: bearer
    supported_auth_types:
      - bearer
    default_preferred_protocol: chat_completions
    default_supported_protocols:
      - chat_completions
      - responses
    protocol_selectable: true
    capabilities:
      api_keys: true
      oauth_accounts: false
      local_usage_meter: false
      model_discovery: true
      usage_limits: false
      api_key_usage: false
      api_key_usage_status: unsupported
      model_protocol_routing: false
      supported_upstream_protocols: [chat_completions, responses]
      api_key_auth_assist: false
      model_catalog_authoritative: false
      event_stream_response: false
      auth_panel: null

