[package]
name = "exoroute"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A lightweight AI protocol gateway and router"
license = "MIT"

[dependencies]
argon2 = "0.5"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
bincode = "1.3"
bytes = "1"
chacha20poly1305 = "0.10"
dotenvy = "0.15"
fs2 = "0.4"
futures-util = "0.3"
heed = { version = "0.22.1", default-features = false, features = ["serde", "serde-bincode"] }
http = "1"
if-addrs = "0.14"
mime_guess = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
zxcvbn = "3.1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
