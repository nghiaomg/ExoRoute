<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <script>
      try {
        const savedTheme = localStorage.getItem('exoroute.theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const darkMode = savedTheme === 'dark' || (!savedTheme && prefersDark);
        if (darkMode) document.documentElement.classList.add('theme-dark');
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', darkMode ? '#11121b' : '#f6f7fb');
        const savedLocale = localStorage.getItem('exoroute.locale');
        if (savedLocale) {
          document.documentElement.lang = savedLocale;
          if (savedLocale === 'ar') document.documentElement.dir = 'rtl';
        }
      } catch {}
    </script>
    <meta name="description" content="ExoRoute gateway administration" />
    <title>ExoRoute — Gateway</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
