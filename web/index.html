<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" />
    <script>
      try {
        // Resolves the stored theme id to its base scheme before any CSS
        // loads so switching palettes cannot flash the classic light theme.
        // lib/theme.ts owns the canonical id list; keep both in sync.
        const themeIds = ['light', 'dark', 'tokyo-night', 'catppuccin', 'linear', 'cyber-neon', 'minimal-light'];
        const darkIds = new Set(['dark', 'tokyo-night', 'catppuccin', 'linear', 'cyber-neon']);
        const saved = localStorage.getItem('exoroute.theme');
        const id = themeIds.includes(saved) ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const scheme = darkIds.has(id) ? 'dark' : 'light';
        const root = document.documentElement;
        root.dataset.theme = scheme;
        root.dataset.palette = id;
        root.dataset.themeStyle = id;
        root.style.colorScheme = scheme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', scheme === 'dark' ? '#11121b' : '#f6f7fb');
        const savedLocale = localStorage.getItem('exoroute.locale');
        if (savedLocale) {
          document.documentElement.lang = savedLocale;
          if (savedLocale === 'ar') document.documentElement.dir = 'rtl';
        }
      } catch {}
    </script>
    <meta name="description" content="ExoRoute gateway administration" />
    <title>ExoRoute — Gateway</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
